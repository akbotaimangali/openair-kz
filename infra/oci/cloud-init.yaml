#cloud-config
# Prepares a plain nginx static host. The site itself is uploaded by scripts/deploy-oci.sh.
package_update: true
package_upgrade: true
packages:
  - nginx
  - rsync

write_files:
  - path: /etc/nginx/sites-available/openair
    content: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        server_tokens off;

        root /var/www/openair;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location / {
          try_files $uri $uri/ =404;
        }

        # Vite puts hashed, immutable files in assets/.
        location /assets/ {
          expires 30d;
          add_header Cache-Control "public, immutable";
        }
      }
  - path: /var/www/openair/index.html
    content: |
      <!doctype html><title>OpenAir KZ</title><p>Server is ready. Run scripts/deploy-oci.sh to upload the site.</p>

runcmd:
  - chown -R ubuntu:ubuntu /var/www/openair
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/openair /etc/nginx/sites-enabled/openair
  # OCI Ubuntu images ship iptables rules that reject everything except SSH.
  - iptables -I INPUT -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
  - ip6tables -I INPUT -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
  - netfilter-persistent save
  - systemctl enable --now nginx
  - systemctl reload nginx
